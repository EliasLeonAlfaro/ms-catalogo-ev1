server:
  port: 8082

spring:
  application:
    name: ms-catalogo

  datasource:
    url: jdbc:postgresql://localhost:5432/catalogo
    username: postgres
    password: 'admin'
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 4

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true